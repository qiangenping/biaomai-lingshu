# Example Nginx Reverse Proxy for api.biaomai.ai (Global) / api.biaomai.cn (CN)
server {
    listen 443 ssl http2;
    server_name api.biaomai.ai;

    ssl_certificate     /etc/letsencrypt/live/api.biaomai.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.biaomai.ai/privkey.pem;

    # Quota & Credit-Gated MCP + Billing Webhooks
    location /api/unified/mcp {
        proxy_pass http://127.0.0.1:19900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:19900;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
