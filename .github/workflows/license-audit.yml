name: License & Governance Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  license-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Apache-2.0 / MIT License Compliance & Required Governance Files
        run: node scripts/verify-licenses.mjs
